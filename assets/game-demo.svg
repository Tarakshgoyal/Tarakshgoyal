<g filter="url(#g)"><text x="450" y="204" text-anchor="middle" fill="#00ff9c" font-size="22" font-weight="700">▶ CLICK TO TAKE CONTROL<animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></text></g>
