<use xlink:href="#bug"><animateTransform attributeName="transform" type="translate" values="810,-20;780,300" dur="3.4s" begin="-2.4s" repeatCount="indefinite"/></use>

<g filter="url(#g)">
<animateTransform attributeName="transform" type="translate" values="140,330;740,330;330,330;600,330;140,330" dur="12s" repeatCount="indefinite"/>
