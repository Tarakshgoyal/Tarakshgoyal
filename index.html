<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Summit Defender · Taraksh</title>
<style>
:root{--g:#00ff9c}
html,body{margin:0;height:100%;background:#03060a;color:var(--g);font:14px/1.4 "Fira Code",Consolas,ui-monospace,monospace;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{border:1px solid var(--g);box-shadow:0 0 28px #00ff9c44;max-width:100vw;max-height:86vh;touch-action:none;cursor:crosshair}
p{margin:10px 8px 0;opacity:.75;text-align:center}
</style></head><body>
<canvas id="c" width="480" height="640" aria-label="Summit Defender game"></canvas>
<p>move: ← → / A D / drag · auto-fire · start: SPACE or tap</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=640;
let s='menu',score=0,lives=3,t=0,hi=0,p,bul=[],en=[],par=[],keys={},tx=null;
try{hi=+localStorage.getItem('summit-hi')||0}catch(e){}
const stars=[...Array(60)].map(()=>({x:Math.random()*W,y:Math.random()*H,v:.3+Math.random()*1.2}));
function reset(){score=0;lives=3;t=0;p={x:W/2,y:H-70,cd:0,inv:0};bul=[];en=[];par=[];s='play'}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '||e.key==='Enter'){if(s!=='play')reset();e.preventDefault()}});
addEventListener('keyup',e=>keys[e.key]=0);
const pos=e=>{const r=c.getBoundingClientRect();return (e.clientX-r.left)*W/r.width};
c.addEventListener('pointerdown',e=>{if(s!=='play')reset();tx=pos(e)});
c.addEventListener('pointermove',e=>{if(e.buttons)tx=pos(e)});
addEventListener('pointerup',()=>tx=null);
function boom(X,Y){for(let i=0;i<12;i++)par.push({x:X,y:Y,vx:Math.random()*6-3,vy:Math.random()*6-3,l:25})}
function hit(){lives--;p.inv=90;if(lives<=0){s='over';hi=Math.max(hi,score);try{localStorage.setItem('summit-hi',hi)}catch(e){}}}
function step(){
 stars.forEach(a=>{a.y+=a.v*(s==='play'?2:1);if(a.y>H){a.y=0;a.x=Math.random()*W}});
 if(s!=='play')return;
 t++;const sp=5;
 if(keys.ArrowLeft||keys.a)p.x-=sp;
 if(keys.ArrowRight||keys.d)p.x+=sp;
 if(tx!==null)p.x+=Math.max(-sp*1.6,Math.min(sp*1.6,tx-p.x));
 p.x=Math.max(20,Math.min(W-20,p.x));
 if(--p.cd<=0){bul.push({x:p.x,y:p.y-18});p.cd=11}
 if(p.inv>0)p.inv--;
 if(t%Math.max(14,50-(t/60|0))===0)en.push({x:30+Math.random()*(W-60),y:-20,v:1.2+Math.random()*1.2+t/3000,ph:Math.random()*6});
 bul.forEach(b=>b.y-=9);bul=bul.filter(b=>b.y>-10);
 en.forEach(e=>{e.y+=e.v;e.x+=Math.sin(t/30+e.ph)*1.2});
 for(const e of en)for(const b of bul)if(!e.dead&&Math.abs(e.x-b.x)<16&&Math.abs(e.y-b.y)<16){e.dead=1;b.y=-99;score+=10;boom(e.x,e.y)}
 en=en.filter(e=>{
  if(e.dead)return false;
  if(e.y>H-40){hit();return false}
  if(s==='play'&&p.inv<=0&&Math.abs(e.x-p.x)<20&&Math.abs(e.y-p.y)<20){hit();boom(e.x,e.y);return false}
  return true});
 par.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--});par=par.filter(q=>q.l>0);
}
function ridge(col,base,amp,k,ph,stp){x.fillStyle=col;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=stp)x.lineTo(i,H-base-Math.abs(Math.sin(i*k+ph))*amp);x.lineTo(W,H);x.fill()}
function draw(){
 x.fillStyle='#03060a';x.fillRect(0,0,W,H);
 x.shadowBlur=0;x.fillStyle='#9fffd6';stars.forEach(a=>x.fillRect(a.x,a.y,a.v>1?2:1,a.v>1?2:1));
 ridge('#0a1f18',60,90,.021,1,40);ridge('#0d2a1f',25,60,.013,0,30);
 x.textAlign='center';x.shadowColor='#00ff9c';x.shadowBlur=10;x.fillStyle='#00ff9c';x.font='22px monospace';
 en.forEach(e=>x.fillText('🐛',e.x,e.y));
 if(s!=='menu'&&p.inv%8<5){x.beginPath();x.moveTo(p.x,p.y-18);x.lineTo(p.x+16,p.y+14);x.lineTo(p.x,p.y+7);x.lineTo(p.x-16,p.y+14);x.closePath();x.fill()}
 bul.forEach(b=>x.fillRect(b.x-2,b.y,4,12));
 par.forEach(q=>{x.globalAlpha=q.l/25;x.fillRect(q.x,q.y,3,3)});x.globalAlpha=1;x.shadowBlur=0;
 x.font='16px monospace';x.textAlign='left';x.fillText('SCORE '+score,12,24);
 x.textAlign='right';x.fillText('BEST '+hi+'  '+'♥'.repeat(Math.max(lives,0)),W-12,24);
 if(s!=='play'){
  x.fillStyle='#03060acc';x.fillRect(0,H/2-90,W,180);x.fillStyle='#00ff9c';x.textAlign='center';
  x.font='26px monospace';x.fillText(s==='menu'?'SUMMIT DEFENDER':'SEGFAULT · '+score,W/2,H/2-30);
  x.font='14px monospace';x.fillText(s==='menu'?'squash the bugs before they reach base camp':'best run: '+hi,W/2,H/2+2);
  x.fillText('[ SPACE / TAP ] '+(s==='menu'?'deploy':'retry'),W/2,H/2+40)}
}
let last=0,acc=0;
(function loop(n){acc+=Math.min(n-last,100);last=n;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)})(0);
</script></body></html>
